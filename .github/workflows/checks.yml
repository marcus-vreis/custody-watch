name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Necessário para percorrer o intervalo de commits do PR abaixo.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: interface do replay
        run: node --test tests/test_replay_link.cjs tests/test_map_positions.cjs tests/test_camera_inspector.cjs

      - run: uv sync --extra dev

      # Roda os hooks de pre-commit, incluindo a suíte de testes.
      - run: uv run pre-commit run --all-files --show-diff-on-failure

      # O hook de co-autoria é de estágio commit-msg, então `--all-files` não o
      # alcança. Aplicado aqui a cada commit do PR, reutilizando a mesma
      # definição em vez de duplicar o regex.
      - name: mensagens de commit
        if: github.event_name == 'pull_request'
        run: |
          for sha in $(git rev-list ${{ github.event.pull_request.base.sha }}..HEAD); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            uv run pre-commit run sem-coautoria-de-ia \
              --hook-stage commit-msg \
              --commit-msg-filename "$RUNNER_TEMP/msg"
          done
